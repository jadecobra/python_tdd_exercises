name: Docs

on:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: install dependencies
        run: uv sync --frozen --no-dev --no-install-project --extra docs

      - name: build sphinx documentation
        run: uv run sphinx-build -d build/doctrees -j auto ./source ./build/html

      - name: rescope dark pygments to the theme toggle
        run: uv run python tools/rescope_pygments_dark.py build/html
