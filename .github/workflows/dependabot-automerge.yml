name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    timeout-minutes: 5
    if: github.actor == 'dependabot[bot]' && contains(github.event.pull_request.title, 'uv-minor-and-patch')
    runs-on: ubuntu-latest
    steps:
      - name: enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
